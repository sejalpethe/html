<!DOCTYPE html>
<html>
<head>
    <title>HTML & CSS Journey</title>

    <!-- Internal CSS -->
    <style>
        body {
            margin: 0;
            background-color: white;
            font-family: "Times New Roman", serif;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 55px 30px;
            padding: 35px 7%;
        }

        .box {
            height: 300px;
            border: 2px solid black;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        .text2 {
            color: red;
        }

        .text3 {
            color: blue;
        }

        .text4 {
            color: purple;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Box 1: Inline CSS -->
        <div class="box">
            <span style="color: green;">
                Welcome to HTML & CSS Journey
            </span>
        </div>

        <!-- Box 2: Internal CSS -->
        <div class="box">
            <span class="text2">
                Welcome to HTML & CSS Journey
            </span>
        </div>

        <!-- Box 3: Internal CSS -->
        <div class="box">
            <span class="text3">
                Welcome to HTML & CSS Journey
            </span>
        </div>

        <!-- Box 4: Internal CSS -->
        <div class="box">
            <span class="text4">
                Welcome to HTML & CSS Journey
            </span>
        </div>

    </div>

</body>
</html>
